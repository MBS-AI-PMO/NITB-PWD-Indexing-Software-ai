; ========================================
; Supervisor Configuration for Queue Worker
; For Linux Live Server (Alternative to Systemd)
; ========================================
;
; Installation:
;   sudo apt-get install supervisor
;
; Setup:
;   1. Copy this file to: /etc/supervisor/conf.d/laravel-queue-worker.conf
;   2. Update paths in this file
;   3. Run: sudo supervisorctl reread
;   4. Run: sudo supervisorctl update
;   5. Run: sudo supervisorctl start laravel-queue-worker:*
;
; Commands:
;   Status:  sudo supervisorctl status laravel-queue-worker:*
;   Start:   sudo supervisorctl start laravel-queue-worker:*
;   Stop:    sudo supervisorctl stop laravel-queue-worker:*
;   Restart: sudo supervisorctl restart laravel-queue-worker:*
;   Logs:    tail -f /var/log/laravel-queue-worker.log
;

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/solo_dms/artisan queue:work --queue=document-extraction --tries=3 --timeout=600 --max-jobs=1000 --max-time=3600 --sleep=3 --verbose
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/laravel-queue-worker.log
stopwaitsecs=3600
